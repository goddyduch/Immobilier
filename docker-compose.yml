services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-immo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-immo_pass}
      POSTGRES_DB: ${POSTGRES_DB:-immobilier}
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-immo} -d ${POSTGRES_DB:-immobilier}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: uvicorn backend.app:app --host 0.0.0.0 --port 8000 --reload
    environment:
      SHELL: /bin/sh
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-immo}:${POSTGRES_PASSWORD:-immo_pass}@db:5432/${POSTGRES_DB:-immobilier}
      MODEL_PATH: /app/models/modele_poitiers.joblib
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me-local}
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./backend:/app/backend
      - ./models:/app/models
      - ./csv:/app/csv
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_API_PROXY: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    command: ["sh", "-c", "supercronic /app/docker/crontab"]
    environment:
      SHELL: /bin/sh
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-immo}:${POSTGRES_PASSWORD:-immo_pass}@db:5432/${POSTGRES_DB:-immobilier}
      MODEL_PATH: /app/models/modele_poitiers.joblib
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      JINKA_HEADLESS: "1"
    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ./csv:/app/csv
      - ./photos_cache:/app/photos_cache
      - ./docker/crontab:/app/docker/crontab:ro
    depends_on:
      db:
        condition: service_healthy
